[dependencies]
core = "2.1.0"
# LOCAL FORK of icrc1-mo 0.2.1 — see vendor/README.md. Upstream deletes from a Map
# while iterating it in `cleanUpRecents`, which traps and rolls back every
# transfer once a batch of dedup entries expires at the same time.
icrc1-mo = "./vendor/icrc1-mo"
icrc2-mo = "0.2.1"
icrc3-mo = "0.4.3"
icrc4-mo = "0.2.1"
ic-certification = "1.1.0"
class-plus = "0.2.1"
timer-tool = "0.2.1"
star = "0.1.1"

[dev-dependencies]
test = "2.1.2"
fuzz = "1.0.0"
matchers = "2.1.0"

[package]
name = "icrc-fungible"
version = "0.2.1"
description = "ICRC1, ICRC2, ICRC3, ICRC4, and ICRC10 fungible token for motoko"
repository = "https://github.com/icdevsorg/ICRC_fungible"
keywords = [
  "icrc2",
  "icrc1",
  "icrc3",
  "icrc4",
  "icrc10",
  "fungible",
  "token",
  "standard"
]

[toolchain]
moc = "1.3.0"
pocket-ic = "12.0.0"
